<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Неизвестен | @neisceten</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
scroll-behavior:smooth;
}

body{
background:#09090b;
color:white;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:600px;
height:600px;
left:-200px;
top:-150px;
background:#7b2cff55;
filter:blur(180px);
z-index:-2;
}

body::after{
content:"";
position:fixed;
width:700px;
height:700px;
right:-250px;
bottom:-250px;
background:#2563eb55;
filter:blur(220px);
z-index:-2;
}

header{
width:100%;
padding:25px 8%;
display:flex;
justify-content:space-between;
align-items:center;
position:fixed;
top:0;
background:rgba(0,0,0,.35);
backdrop-filter:blur(15px);
z-index:999;
}

.logo{
font-size:28px;
font-weight:800;
color:#b388ff;
}

nav a{
color:white;
text-decoration:none;
margin-left:25px;
transition:.3s;
}

nav a:hover{
color:#b388ff;
}

.hero{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-wrap:wrap;
gap:70px;
padding:140px 8% 60px;
}

.avatar{
width:320px;
border-radius:28px;
box-shadow:0 0 45px #7b2cff;
transition:.5s;
}

.avatar:hover{
transform:scale(1.03);
}

.info h1{
font-size:60px;
font-weight:800;
}

.info h2{
font-size:28px;
color:#b388ff;
margin:12px 0 20px;
}

.info p{
max-width:520px;
line-height:1.8;
color:#cfcfcf;
}

.button{
display:inline-block;
margin-top:35px;
padding:15px 34px;
background:#7b2cff;
border-radius:16px;
text-decoration:none;
color:white;
font-weight:700;
transition:.3s;
}

.button:hover{
transform:translateY(-4px);
box-shadow:0 0 25px #7b2cff;
}

section{
padding:80px 8%;
}

.title{
font-size:40px;
margin-bottom:40px;
font-weight:800;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:25px;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
padding:30px;
border-radius:22px;
transition:.4s;
}

.card:hover{
transform:translateY(-10px);
border-color:#7b2cff;
box-shadow:0 0 35px rgba(123,44,255,.45);
}

.card h3{
margin-bottom:15px;
color:#b388ff;
}

.gallery img{
width:100%;
border-radius:25px;
box-shadow:0 0 30px rgba(123,44,255,.4);
}

footer{
padding:45px;
text-align:center;
color:#888;
}

@media(max-width:850px){

.hero{
text-align:center;
}

.info h1{
font-size:42px;
}

.avatar{
width:260px;
}

header{
padding:20px;
}

nav{
display:none;
}

}

</style>

</head>

<body>

<header>

<div class="logo">
Неизвестен
</div>

<nav>
<a href="#bio">Bio</a>
<a href="#projects">Projects</a>
<a href="#gallery">Gallery</a>
</nav>

</header>
